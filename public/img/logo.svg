<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fda085;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#grad1)" filter="url(#shadow)" />
  <circle cx="60" cy="60" r="53" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Hotel / Roof Shape -->
  <path d="M 60 22 L 28 48 L 36 48 L 36 86 C 36 88 38 90 40 90 L 80 90 C 82 90 84 88 84 86 L 84 48 L 92 48 Z" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Door / Keyhole / Arch -->
  <path d="M 52 90 L 52 68 C 52 64 68 64 68 68 L 68 90 Z" fill="#1e3c72" />

  <!-- Windows with Warm Cozy Glow -->
  <rect x="42" y="52" width="10" height="10" rx="2" fill="url(#accent)" />
  <rect x="68" y="52" width="10" height="10" rx="2" fill="url(#accent)" />

  <!-- Stars / Rating Accents -->
  <polygon points="60,33 62,39 68,39 63,43 65,49 60,45 55,49 57,43 52,39 58,39" fill="url(#accent)"/>
</svg>
